server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  error_page 404 /404.html;

  location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|ico|pdf)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}

